services:
  # mariadb service
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_user_password
    secrets:
      - mysql_root_password
      - mysql_user_password
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    networks:
      - inception
  # wordpress service
  wordpress:
    build: ./requirements/wordpress/
    image: wordpress
    container_name: wordpress
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_user_password
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password
      WP_USER_PASSWORD_FILE: /run/secrets/wp_user_password
    secrets:
      - mysql_root_password
      - mysql_user_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wp_data:/var/www/html/wordpress
    restart: always
    networks:
      - inception
    depends_on:
      - mariadb
  # nginx service
  nginx:
    build: ./requirements/nginx/ 
    image: nginx
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - wp_data:/var/www/html/wordpress
    restart: always
    networks:
      - inception
    depends_on:
      - wordpress
      - mariadb
  
secrets:
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  mysql_user_password:
    file: ../secrets/mysql_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

networks:
  inception:

volumes:
  db_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/dvemba/data/mariadb'
  wp_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/dvemba/data/wordpress'
